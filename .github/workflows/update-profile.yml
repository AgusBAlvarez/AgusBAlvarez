name: Update profile README

on:
  schedule:
    - cron: "0 6 * * *"   # todos los días a las 06:00 UTC
  workflow_dispatch:       # botón "Run workflow" para correrlo a mano
  push:
    paths:
      - config.json
      - README.md
      - .github/scripts/generate.py

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/generate.py

      - name: Commit si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ README.md
          git diff --staged --quiet || git commit -m "chore: actualizar perfil"
          git push
